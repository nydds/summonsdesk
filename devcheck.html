<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>layout check</title>
<style>body{margin:0;font:12px monospace;background:#eee}
.row{display:flex;gap:10px;padding:8px}
iframe{background:#fff;border:1px solid #999}
pre{padding:8px;white-space:pre-wrap}</style></head>
<body>
<div class="row">
  <iframe id="f1" src="/summonsdesk/ko/" width="390" height="844"></iframe>
  <iframe id="f2" src="/summonsdesk/" width="390" height="844"></iframe>
  <iframe id="f3" src="/summonsdesk/ko/intake.html" width="390" height="844"></iframe>
</div>
<pre id="out">measuring…</pre>
<script>
function measure(id){
  var f=document.getElementById(id), d=f.contentDocument, w=f.contentWindow;
  if(!d) return {id:id, error:"no document"};
  var wide=[];
  d.querySelectorAll("body *").forEach(function(el){
    var r=el.getBoundingClientRect();
    if(r.right > w.innerWidth + 1 || r.left < -1){
      wide.push(el.tagName.toLowerCase()+(el.className? "."+String(el.className).split(" ")[0]:"")+" right="+Math.round(r.right));
    }
  });
  return {id:id, innerWidth:w.innerWidth, scrollWidth:d.documentElement.scrollWidth,
          bodyScrollWidth:d.body.scrollWidth, overflowPx:d.documentElement.scrollWidth-w.innerWidth,
          offenders:wide.slice(0,8), count:wide.length};
}
window.addEventListener("load", function(){
  setTimeout(function(){
    var res=["f1","f2","f3"].map(measure);
    document.getElementById("out").textContent=JSON.stringify(res,null,1);
    window.__RESULT__=res;
  }, 1200);
});
</script>
</body></html>
